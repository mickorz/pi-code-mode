<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow 分析 Dashboard</title>
<style>
  /* 设计语言与 thirdparties/PrdGameSkill/.claude/skills/game-prd-check/dashboard/template.html 保持一致：
     浅色底、白卡片、primary #3478DB、PingFang SC、12px 圆角、severity 用 P0~P3 色板 */
  :root {
    --bg: #F6F8FB;
    --card: #FFFFFF;
    --primary: #3478DB;
    --p0: #DC5148;
    --p1: #E8A044;
    --p2: #4389D5;
    --p3: #94A3B8;
    --ai: #9A6FE0;
    --text: #253247;
    --muted: #8491A3;
    --border: #E7ECF2;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 竖屏 / 移动端：显式声明最小高度与可滚动，避免某些浏览器把内容底部裁在视口外 */
  html { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
  }
  header { max-width: 1440px; margin: 0 auto; padding: 24px 32px 0; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap;
    gap: 6px 14px; align-items: center; margin-top: 8px; }
  .sub .path { background: #EEF1F5; color: var(--text); padding: 2px 10px; border-radius: 6px;
    font-family: "SF Mono", Consolas, monospace; font-size: 12px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub .sep { color: #C7D0DC; }

  /* 主导航 Tab：与参考模板 .mtab 一致 */
  nav { display: flex; gap: 8px; margin: 20px auto; padding: 0 32px;
    max-width: 1440px; flex-wrap: wrap; }
  nav button {
    padding: 10px 24px; border: 1px solid var(--border); background: var(--card);
    border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--muted);
    cursor: pointer; font-family: inherit;
  }
  nav button:hover { border-color: var(--primary); color: var(--primary); }
  nav button.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  main { max-width: 1440px; margin: 0 auto; padding: 0 32px 64px;
    padding-bottom: max(64px, calc(32px + env(safe-area-inset-bottom))); }
  section { display: none; }
  section.active { display: block; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }

  /* KPI */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 20px; margin-bottom: 20px; }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 24px;
  }
  .kpi .v { font-size: 34px; font-weight: 700; line-height: 1.2; }
  .kpi .v.c-ok { color: #2F9E5B; }
  .kpi .v.c-low { color: var(--p2); }
  .kpi .v.c-mid { color: #C07A00; }
  .kpi .v.c-high { color: var(--p0); }
  .kpi .l { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* 进度条 */
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    cursor: pointer; padding: 3px 4px; border-radius: 6px; }
  .bar-row:hover { background: #F0F6FD; }
  .bar-row .bl { flex: none; width: 104px; font-weight: 600; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { flex: 1; display: block; height: 18px; background: #F0F3F7;
    border-radius: 4px; overflow: hidden; }
  .fill { display: block; height: 100%; border-radius: 4px; min-width: 4px; }
  .val { flex: none; width: 116px; font-size: 12px; color: var(--muted); text-align: right; }

  /* 表格：与参考模板 table.issues 一致 */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid #F0F3F7; vertical-align: top; font-size: 13px; }
  tbody tr:hover { background: #F7FAFE; }

  /* 徽章：severity 用 P0~P3 色板，AI 用紫色 */
  .tag { display: inline-block; font-size: 11px; font-weight: 700;
    padding: 1px 8px; border-radius: 4px; white-space: nowrap; }
  .tag.critical { background: var(--p0); color: #fff; }
  .tag.high { background: var(--p1); color: #fff; }
  .tag.medium { background: var(--p2); color: #fff; }
  .tag.low { background: var(--p3); color: #fff; }
  .tag.pass { background: #E8F5EC; color: #2F9E5B; }
  .tag.hit { background: #FFF4E0; color: #C07A00; }
  .tag.err { background: #FDECEA; color: var(--p0); }
  .tag.ai { background: #F1EAFD; color: var(--ai); }
  .tag.static { background: #EEF1F5; color: var(--muted); }

  /* 折叠块 */
  details { margin: 12px 0; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
  details[open] { background: #FCFDFE; }
  details details { margin: 8px 0 0; padding: 10px 12px; background: #fff; }
  summary { cursor: pointer; font-weight: 600; font-size: 13px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; color: var(--muted); }
  details[open] > summary::before { content: "▾ "; }

  code { font-family: "SF Mono", Consolas, monospace; font-size: 12.5px;
    background: #EEF1F5; padding: 1px 6px; border-radius: 4px; }
  pre { background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; font-size: 12px; line-height: 1.6; margin: 8px 0;
    white-space: pre-wrap; word-break: break-word;
    font-family: "SF Mono", Consolas, monospace; color: #47586E; }

  ul { margin: 6px 0; padding-left: 20px; }
  li { margin: 4px 0; }
  .muted { color: var(--muted); }

  /* 筛选按钮 */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .filters button {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .filters button:hover { border-color: var(--primary); color: var(--primary); }
  .filters button.on { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* 提示框：与参考模板 .mgmt-box 一致 */
  .note { border-left: 3px solid var(--primary); background: #F6F9FE;
    border-radius: 0 8px 8px 0; padding: 12px 16px; margin-bottom: 14px;
    font-size: 13px; line-height: 1.8; color: #34455C; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  /* 建议卡片 */
  .rec { border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
    margin-bottom: 12px; background: #FCFDFE; }
  .rec h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .rec dl { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13px; }
  .rec dt { color: var(--muted); }
  .rec dd { margin: 0; }

  /* 响应式 */
  @media (max-width: 1024px) {
    header, nav, main { padding-left: 20px; padding-right: 20px; }
  }
  @media (max-width: 768px) {
    h1 { font-size: 18px; }
    .kpis { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { padding: 16px; }
    .bar-row { flex-wrap: wrap; }
    .bar-row .bl { width: 76px; }
    .bar-row .val { width: auto; min-width: 84px; }
    .rec dl { grid-template-columns: 1fr; }
    /* 表格转卡片：竖屏下宽表格会把内容挤出可视区（参考模板同款处理） */
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tbody tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; padding: 10px 12px; }
    tbody tr:hover { background: #fff; }
    tbody td { border: none; padding: 3px 0; }
    details { padding: 10px 12px; }
    nav button { padding: 8px 16px; font-size: 14px; }
  }
</style>
</head>

  <h1>Workflow 分析 Dashboard</h1>

</main>

<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('report-data').textContent);
  var SEV = ['critical', 'high', 'medium', 'low'];
  var SEV_COLOR = { critical: '#DC5148', high: '#E8A044', medium: '#4389D5', low: '#7a8798' };
  var state = { sev: null, rule: null };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function tag(cls, text) { return '<span class="tag ' + cls + '">' + esc(text) + '</span>'; }
  function sevTag(s) { return tag(s, s); }
  function el(id) { return document.getElementById(id); }

  // ---------- 头部 ----------
  el('hdr').innerHTML = [
    '<span class="path" title="' + esc(D.meta.file) + '">' + esc(D.meta.file) + '</span>',
    '<span>风险分 <b>' + D.meta.riskScore + '/100</b></span>',
    '<span>analyzer ' + esc(D.meta.analyzerVersion) + ' / ruleSet ' + esc(D.meta.ruleSetVersion) + '</span>',
    '<span>生成于 ' + esc(String(D.meta.generatedAt).replace('T', ' ').slice(0, 19)) + '</span>',
    '<span>AI 复核：' + (D.meta.aiEnabled ? tag('ai', '已开启') : tag('static', '未开启')) + '</span>'
  ].join('<span class="sep">·</span>');

  // ---------- 概览 ----------
  (function () {
    var e = D.estimate;
    // 风险用百分比：0-100 分值本质就是百分比刻度，"8/100" 不如 "8%" 直观。
    // 主数字用**聚合风险**（取最危险单文件）——入口风险常远低于实际，
    // 只显示入口会让用户低估问题（实测入口 8% vs 聚合 14%）。
    var riskPct = D.meta.aggregateRiskScore !== undefined ? D.meta.aggregateRiskScore : D.meta.riskScore

    var riskLabel = D.meta.aggregateRiskScore !== undefined
      ? '最高单文件风险' + (D.meta.entryRiskScore !== undefined ? '（入口 ' + D.meta.entryRiskScore + '%）' : '')
      : '风险分'
    var kpis = [
      { v: riskPct + '%', l: riskLabel, cls: riskClass },
      { v: D.summary.totalFindings, l: '问题条数' },
      { v: e.callSites, l: '调用点（agent ' + e.agentCallSites + '）' },
      { v: e.estimatedTasks + (e.determined ? '' : '↓'), l: '估算任务量' + (e.determined ? '' : '（下限）') },
      { v: D.subtree ? D.subtree.files : 1, l: D.subtree ? '聚合文件数' : '分析文件数' },
      { v: D.rules.filter(function (r) { return r.hits > 0; }).length + '/' + D.rules.length, l: '命中规则 / 总数' }
    ];
    if (e.concurrency !== undefined) kpis.push({ v: e.concurrency, l: '并发上限' });
    if (e.estimatedWaves !== undefined) kpis.push({ v: e.estimatedWaves, l: '预计波次' });
    if (e.dynamicNodes > 0) kpis.push({ v: e.dynamicNodes, l: '动态节点（静态不可知）' });

    var h = '<div class="kpis">' + kpis.map(function (k) {
      return '<div class="kpi"><div class="v' + (k.cls ? ' ' + k.cls : '') + '">' + esc(k.v) +
        '</div><div class="l">' + esc(k.l) + '</div></div>';
    }).join('') + '</div>';

    // 严重度分布
    var total = D.summary.totalFindings || 0;
    var rows = SEV.map(function (s) {
      var n = D.summary.counts[s] || 0;
      if (!n) return '';
      var pct = total ? (n / total * 100) : 0;
      return '<div class="bar-row" onclick="window.__f(\'sev\',\'' + s + '\')">' +
        '<span class="bl">' + s + '</span>' +
        '<span class="track"><span class="fill" style="width:' + pct + '%;background:' + SEV_COLOR[s] + '"></span></span>' +
        '<span class="val">' + n + ' · ' + pct.toFixed(1) + '%</span></div>';
    }).join('');
    h += '<div class="note"><b>关于「置信度」</b>：表示这条判断有多可信（0~1，越大越可信）。' +
      '≥0.85 确定、≥0.7 很可能、≥0.5 待确认（需人工判断）、<b>&lt;0.5 仅提示</b>（不计入风险分，只作检查线索）。</div>';
    h += '<div class="card"><h2>严重度分布（点击筛选问题列表）</h2>' + (rows || '<div class="empty">无问题</div>') + '</div>';

    // 规则命中分布
    var hitRules = D.rules.slice().sort(function (a, b) { return b.hits - a.hits; });
    var maxHit = hitRules.length ? Math.max.apply(null, hitRules.map(function (r) { return r.hits; })) : 1;
    var rrows = hitRules.map(function (r) {
      var pct = maxHit ? (r.hits / maxHit * 100) : 0;
      var color = r.status === 'error' ? '#DC5148' : (r.hits > 0 ? SEV_COLOR[r.severity] || '#4389D5' : '#2c3444');
      return '<div class="bar-row" onclick="window.__f(\'rule\',\'' + esc(r.id) + '\')">' +
        '<span class="bl">' + esc(r.id) + '</span>' +
        '<span class="track"><span class="fill" style="width:' + pct + '%;background:' + color + '"></span></span>' +
        '<span class="val">' + (r.status === 'error' ? '执行失败' : (r.hits > 0 ? r.hits + ' 命中' : '通过')) + '</span></div>';
    }).join('');
    h += '<div class="card"><h2>规则命中分布（全部 ' + D.rules.length + ' 条规则均已执行）</h2>' + rrows + '</div>';

    if (D.meta.aiSummary) {
      h += '<div class="card"><h2>' + tag('ai', 'AI') + ' 总体判断</h2><div>' + esc(D.meta.aiSummary) + '</div></div>';
    }
    if (D.diagnostics.length) {
      h += '<div class="card"><h2>诊断信息</h2><ul>' + D.diagnostics.map(function (d) {
        return '<li>' + esc(d) + '</li>';
      }).join('') + '</ul></div>';
    }
    el('v-overview').innerHTML = h;
  })();

  // ---------- 规则检查（核心：全量规则 + 是否命中 + 检查说明） ----------
  (function () {
    var byStatus = { hit: [], pass: [], error: [], 'ai-only': [] };
    D.rules.forEach(function (r) { byStatus[r.status].push(r); });
    var h = '<div class="card"><h2>规则检查清单</h2>' +
      '<div class="note">共 ' + D.rules.length + ' 条规则：命中 ' + byStatus.hit.length +
      ' 条、通过 ' + byStatus.pass.length + ' 条、静态不判定（AI 负责）' + byStatus['ai-only'].length +
      ' 条、执行失败 ' + byStatus.error.length + ' 条。' +
      '「通过」表示该规则检查过且未发现问题，不是没检查。静态列为程序规则结果，AI 复核列为模型按规则文档独立判定。</div>' +
      '<table><thead><tr><th>规则</th><th>严重度</th><th>静态</th><th>AI 复核</th><th>最终</th><th>检查项</th></tr></thead><tbody>';
    var AI_LABEL = { hit: 'hit', pass: 'pass', 'uncertain': '待确认', 'not-applicable': '不适用', error: '失败' };
    var FINAL_CLASS = { pass: 'pass', 'static-hit': 'hit', 'ai-hit': 'ai', both: 'ai', conflict: 'err', uncertain: 'hit', error: 'err', 'ai-only': 'ai' };
    D.rules.forEach(function (r) {
      var res = r.status === 'error' ? tag('err', '执行失败')
        : r.hits > 0 ? tag('hit', '命中 ' + r.hits)
        : r.status === 'ai-only' ? tag('static', '静态不判定')
        : tag('pass', '通过');
      var ai = r.aiStatus
        ? tag(r.aiStatus === 'hit' ? 'ai' : (r.aiStatus === 'pass' ? 'pass' : (r.aiStatus === 'error' ? 'err' : 'hit')),
              AI_LABEL[r.aiStatus] || r.aiStatus) + (r.aiConfidence !== undefined ? ' <span class="muted">' + r.aiConfidence.toFixed(2) + '</span>' : '')
        : '<span class="muted">未启用</span>';
      var fin = r.finalStatus ? tag(FINAL_CLASS[r.finalStatus] || 'pass', r.finalStatus) : '<span class="muted">-</span>';
      h += '<tr><td><code>' + esc(r.id) + '</code></td><td>' + sevTag(r.severity) + '</td><td>' + res +
        '</td><td>' + ai + '</td><td>' + fin + '</td><td>' + esc(r.description) +
        (r.note ? '<div class="muted">' + esc(r.note) + '</div>' : '') +
        (r.error ? '<div class="muted">错误：' + esc(r.error) + '</div>' : '') + '</td></tr>';
    });
    h += '</tbody></table></div>';

    if (D.aiRuleCheck) {
      var a = D.aiRuleCheck;
      var STAT = { completed: '已完成', partial: '部分完成', failed: '失败', skipped: '跳过' };
      h += '<div class="card"><h2>' + tag('ai', 'AI Rule Check') + ' ' + esc(STAT[a.status] || a.status) +
        (a.durationMs ? ' <span class="muted">耗时 ' + (a.durationMs / 1000).toFixed(1) + 's</span>' : '') +
        '</h2>';
      if (a.diagnostics.length) {
        h += '<div class="note">诊断：<ul>' + a.diagnostics.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
      }
      var aiHit = a.checks.filter(function (c) { return c.status === 'hit'; });
      var aiUnc = a.checks.filter(function (c) { return c.status === 'uncertain'; });
      h += '<div class="filters"><span class="muted">命中 ' + aiHit.length + ' / 待确认 ' + aiUnc.length + ' / 共 ' + a.checks.length + ' 条</span></div>';
      a.checks.forEach(function (c) {
        if (c.status === 'pass') return;
        h += '<details' + (c.status === 'hit' ? ' open' : '') + '><summary>' +
          tag(c.status === 'hit' ? 'ai' : (c.status === 'error' ? 'err' : 'hit'), c.status) +
          ' <code>' + esc(c.ruleId) + '</code> <span class="muted">置信度 ' + c.confidence.toFixed(2) +
          (c.confLabel ? '（' + esc(c.confLabel) + '）' : '') +
          ' · 证据 ' + c.evidence.length + ' 条</span></summary>' +
          (c.reason ? '<div>' + esc(c.reason) + '</div>' : '') +
          (c.error ? '<div class="muted">' + esc(c.error) + '</div>' : '') +
          c.evidence.map(function (e) {
            return '<div class="muted">' + esc(e.file) + ' L' + e.startLine + '-' + e.endLine + '</div><pre>' + esc(e.quote) + '</pre>';
          }).join('') +
          '</details>';
      });
      h += '</div>';
    }
    el('v-rules').innerHTML = h;
  })();

  // ---------- 问题列表（筛选） ----------
  function renderIssues() {
    var list = D.findings.filter(function (f) {
      return (!state.sev || f.severity === state.sev) && (!state.rule || f.ruleId === state.rule);
    });
    var clusters = (D.clusters || []).filter(function (c) {
      return (!state.sev || c.severity === state.sev) && (!state.rule || c.ruleId === state.rule);
    });
    var h = '<div class="card"><h2>问题列表（' + list.length + ' 条 → ' + clusters.length + ' 个问题簇）</h2>';
    h += '<div class="note">同类问题已合并展示：一个簇 = 一件要改的事，点开可看簇内每处位置。原始 ' + D.findings.length + ' 条明细见报告 JSON。</div>';
    h += '<div class="filters"><span class="muted">严重度：</span>';
    h += '<button data-sev="" class="' + (state.sev ? '' : 'on') + '">全部</button>';
    SEV.forEach(function (s) {
      var n = D.summary.counts[s] || 0;
      if (!n) return;
      h += '<button data-sev="' + s + '" class="' + (state.sev === s ? 'on' : '') + '">' + s + ' ' + n + '</button>';
    });
    if (state.rule) {
      h += '<span class="muted" style="margin-left:8px">规则：</span><button data-rule="">' + esc(state.rule) + ' ×</button>';
    }
    h += '</div>';
    if (!clusters.length) {
      h += '<div class="empty">没有匹配的问题簇。</div>';
    }
    // 按簇渲染：标题行给规则/严重度/处数/文件数，展开看位置与证据
    clusters.forEach(function (c, i) {
      var inCluster = list.filter(function (f) { return f.ruleId === c.ruleId; });
      var title = c.ruleId + (c.count > 1 ? ' · ' + c.count + ' 处同类问题' : '');
      h += '<details' + (i < 3 ? ' open' : '') + '><summary>' + sevTag(c.severity) + ' <code>' + esc(c.ruleId) + '</code> ' +
        '<b>' + esc(title) + '</b> <span class="muted">置信度 ' + c.confidence.toFixed(2) +
        '（' + esc(c.confLabel || '') + '）' +
        ' · ' + c.files.length + ' 个文件</span></summary>' +
        (c.confHint ? '<div class="muted" style="margin-top:4px">' + esc(c.confHint) + '</div>' : '');
      h += '<div style="margin:8px 0 4px"><b>位置：</b>' + c.locations.map(function (l) {
        return '<code>' + esc(l) + '</code>';
      }).join(' ') + (c.moreLocations > 0 ? ' <span class="muted">（另有 ' + c.moreLocations + ' 处）</span>' : '') + '</div>';
      if (c.evidence.length) {
        h += '<ul>' + c.evidence.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>';
      }
      if (c.snippet) h += '<pre>' + esc(c.snippet) + '</pre>';
      if (c.suggestion) h += '<div><b>建议：</b>' + esc(c.suggestion) + '</div>';
      // 簇内明细（折叠）
      if (inCluster.length > 1) {
        h += '<details style="margin-left:12px"><summary class="muted">展开簇内 ' + inCluster.length + ' 条明细</summary>';
        inCluster.forEach(function (f) {
          h += '<div style="margin:6px 0"><code>' + esc(f.file || '') + ':L' + f.startLine + '-' + f.endLine + '</code>' +
            (f.evidence[0] ? '<div class="muted">' + esc(f.evidence[0].slice(0, 160)) + '</div>' : '') + '</div>';
        });
        h += '</details>';
      }
      h += '</details>';
    });
    h += '</div>';
    el('v-issues').innerHTML = h;
    el('v-issues').querySelectorAll('button[data-sev]').forEach(function (b) {
      b.onclick = function () { state.sev = b.getAttribute('data-sev') || null; renderIssues(); };
    });
    el('v-issues').querySelectorAll('button[data-rule]').forEach(function (b) {
      b.onclick = function () { state.rule = null; renderIssues(); };
    });
  }
  window.__f = function (kind, val) {
    if (kind === 'sev') { state.sev = val; state.rule = null; }
    if (kind === 'rule') { state.rule = val; state.sev = null; }
    renderIssues();
    switchTab('issues');
    window.scrollTo(0, 0);
  };

  // ---------- 子 Workflow ----------
  (function () {
    var h = '';
    if (!D.subtree) {
      h = '<div class="card"><h2>子 Workflow</h2><div class="empty">本次分析未聚合子 Workflow（单文件或入口无同目录子流程）。</div></div>';
    } else {
      var s = D.subtree;
      h = '<div class="card"><h2>聚合概览</h2><div class="note">聚合口径：取最危险单文件的风险分（不求和，避免虚高）。' +
        '共 ' + s.files + ' 个文件 / ' + s.callSites + ' 个调用点 / ' + s.totalFindings + ' 条问题，最高风险 ' +
        s.maxRisk + '/100' + (s.riskiest ? '（' + esc(s.riskiest) + '）' : '') + '。</div>' +
        '<div class="filters"><span class="muted">规则分布：</span>' +
        Object.keys(s.rules).sort(function (a, b) { return s.rules[b] - s.rules[a]; }).map(function (k) {
          return tag('static', k + ' ×' + s.rules[k]);
        }).join(' ') + '</div></div>';

      var sorted = s.subWorkflows.slice().sort(function (a, b) { return b.riskScore - a.riskScore; });
      var maxRisk = sorted.length ? Math.max.apply(null, sorted.map(function (x) { return x.riskScore; })) : 1;
      h += '<div class="card"><h2>各文件风险（点击按主要规则筛选）</h2>';
      h += sorted.map(function (x) {
        var pct = maxRisk ? (x.riskScore / maxRisk * 100) : 0;
        return '<div class="bar-row"' + (x.topRule ? ' onclick="window.__f(\'rule\',\'' + esc(x.topRule) + '\')"' : '') + '>' +
          '<span class="bl" title="' + esc(x.file) + '">' + esc(x.file) + '</span>' +
          '<span class="track"><span class="fill" style="width:' + pct + '%;background:' + (x.riskScore >= 20 ? '#DC5148' : (x.riskScore >= 10 ? '#E8A044' : '#4389D5')) + '"></span></span>' +
          '<span class="val">' + x.riskScore + ' · ' + x.totalFindings + ' 问题</span></div>';
      }).join('');
      h += '</div>';

      h += '<div class="card"><h2>明细</h2><table><thead><tr><th>文件</th><th>风险分</th><th>调用点</th><th>问题数</th><th>主要规则</th></tr></thead><tbody>' +
        sorted.map(function (x) {
          return '<tr><td>' + esc(x.file) + '</td><td>' + x.riskScore + '</td><td>' + x.callSites +
            '</td><td>' + x.totalFindings + '</td><td>' + (x.topRule ? '<code>' + esc(x.topRule) + '</code>' : '-') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    el('v-subtree').innerHTML = h;
  })();

  // ---------- 建议与 AI ----------
  (function () {
    var ai = D.recommendations.filter(function (r) { return r.source === 'ai'; });
    var st = D.recommendations.filter(function (r) { return r.source !== 'ai'; });
    var h = '<div class="card"><h2>建议总览</h2><div class="note">' +
      '共 ' + D.recommendations.length + ' 条建议：' + tag('ai', 'AI 复核 ' + ai.length) + ' 条、' +
      tag('static', '静态规则 ' + st.length) + ' 条。AI 建议的 expectedImpact 无基准时一律「待 Benchmark」。' +
      (D.meta.aiEnabled ? '' : '（本次未开启 AI，用 --suggest 可开启）') + '</div></div>';

    function block(list, title, emptyText) {
      var s = '<div class="card"><h2>' + title + '（' + list.length + '）</h2>';
      if (!list.length) return s + '<div class="empty">' + emptyText + '</div></div>';
      list.forEach(function (r) {
        s += '<div class="rec"><h3>' + esc(r.id) + ' ' + esc(r.title) + ' ' +
          (r.source === 'ai' ? tag('ai', 'AI') : tag('static', '静态')) + ' ' + sevTag(r.severity) + '</h3><dl>' +
          '<dt>关联规则</dt><dd>' + (r.ruleIds.length ? r.ruleIds.map(function (x) { return '<code>' + esc(x) + '</code>'; }).join(' ') : '<span class="muted">由 AI 语义分析得出，无静态规则关联</span>') + '</dd>' +
          '<dt>预期收益</dt><dd>' + esc(r.expectedImpact) + '</dd>' +
          '<dt>质量风险</dt><dd>' + esc(r.qualityRisk) + '</dd>' +
          '<dt>验证条件</dt><dd><ul>' + r.validation.map(function (v) { return '<li>' + esc(v) + '</li>'; }).join('') + '</ul></dd>' +
          '</dl></div>';
      });
      return s + '</div>';
    }
    h += block(ai, 'AI 复核建议', D.meta.aiEnabled ? 'AI 未产出结构化建议（可能超时或输出不合规，见诊断）' : '本次未开启 AI 复核');
    h += block(st, '静态规则建议', '无静态建议');

    if (D.unknowns.length) {
      h += '<div class="card"><h2>静态不可判定（禁止据此自动并行化）</h2><ul>' +
        D.unknowns.map(function (u) { return '<li>L' + u.line + ' <code>' + esc(u.id) + '</code>：' + esc(u.reason) + '</li>'; }).join('') +
        '</ul></div>';
    }
    el('v-recs').innerHTML = h;
  })();

  // ---------- Tab 切换 ----------
  function switchTab(v) {
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-v') === v);
    });
    ['overview', 'rules', 'issues', 'subtree', 'recs'].forEach(function (n) {
      el('v-' + n).classList.toggle('active', n === v);
    });
  }
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (b) { switchTab(b.getAttribute('data-v')); window.scrollTo(0, 0); }
  });

  renderIssues();
})();
</script>
</body>
</html>
